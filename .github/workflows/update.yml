name: Update NFL Edge

on:
  schedule:
    # GitHub uses UTC. These are ET during daylight time (EDT); they shift 1 hour earlier after Nov 1.
    - cron: "43 22 * * 3"   # Wed 6:43pm ET  - first look with mid-week injury reports
    - cron: "43 23 * * 5"   # Fri 7:43pm ET  - after final injury reports
    - cron: "7 16 * * 0"    # Sun 12:07pm ET - after inactives, before 1pm kickoffs
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build report
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python nfl_edge.py --standalone --lines lines.csv --out site/index.html
          cp site/index_picks.json site/picks.json || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
